@let p = card().project;
<div class="project-image">
  @if (p.imageUrl) {
    <!-- Uploaded banner (admin) replaces the illustrated artwork. -->
    <div class="project-photo">
      <img [ngSrc]="p.imageUrl" fill sizes="(max-width: 800px) 100vw, 40vw" alt="" />
      <span class="art-coordinates">
        @for (line of p.coordinates; track $index) {
          @if (!$first) {<br />}
          {{ line }}
        }
      </span>
    </div>
  } @else {
    <div appProjectArt [variant]="p.artVariant" [coordinates]="p.coordinates" [index]="card().position"></div>
  }
</div>
<div class="project-copy">
  <div class="project-meta">
    <span>{{ card().position }} / {{ p.type }}</span>
    <span>{{ p.year }}</span>
  </div>
  <h3>{{ p.name }}</h3>
  <p>{{ p.description }}</p>
  <div class="project-stack">
    <span>{{ p.stack }}</span>
    @if (p.url) {
      <a [href]="p.url" target="_blank" rel="noreferrer" [attr.aria-label]="'Open ' + p.name"><b>↗</b></a>
    } @else {
      <b>↗</b>
    }
  </div>
</div>
<span class="route-node">{{ card().position }}</span>
