@let s = section();
<svg appContour class="contact-contour"></svg>
<div class="contact-top">
  <span class="summit-note">
    @for (line of s.note; track $index) {
      @if (!$first) {<br />}
      {{ line }}
    }
  </span>
</div>
<h2 appDisplayHeading [lines]="s.headingLines" [emphasis]="s.emphasis" [inline]="!!s.emphasisInline"></h2>
@if (formSettings.enabled) {
  <app-contact-form [config]="form()" [turnstileSiteKey]="formSettings.turnstileSiteKey" />
}
<div class="signpost">
  <div class="post"></div>
  @for (link of links(); track link.kind) {
    <a appContactSign [link]="link"></a>
  }
</div>
