@let c = config();
<form
  class="contact-form"
  [formGroup]="form"
  (ngSubmit)="submit()"
  [attr.aria-busy]="state() === 'sending'"
  aria-labelledby="contact-form-title"
  novalidate
>
  <p class="contact-form-title" id="contact-form-title">{{ c.title }}</p>

  <label for="contact-name">{{ c.nameLabel }}</label>
  <input
    id="contact-name"
    type="text"
    formControlName="name"
    autocomplete="name"
    maxlength="200"
    required
    [attr.aria-invalid]="invalid('name')"
  />

  <label for="contact-email">{{ c.emailLabel }}</label>
  <input
    id="contact-email"
    type="email"
    formControlName="email"
    autocomplete="email"
    maxlength="320"
    required
    [attr.aria-invalid]="invalid('email')"
  />

  <label for="contact-message">{{ c.messageLabel }}</label>
  <textarea
    id="contact-message"
    rows="4"
    formControlName="message"
    maxlength="5000"
    required
    [attr.aria-invalid]="invalid('message')"
  ></textarea>

  <!-- Honeypot: invisible and unreachable for people; bots that fill it are ignored. -->
  <div class="contact-form-trap" aria-hidden="true">
    <label for="contact-website">Website</label>
    <input id="contact-website" type="text" formControlName="website" tabindex="-1" autocomplete="off" />
  </div>

  @if (turnstileSiteKey()) {
    <app-turnstile [siteKey]="turnstileSiteKey()" (tokenChange)="onToken($event)" />
  }

  <button type="submit" [disabled]="state() === 'sending'">
    {{ state() === 'sending' ? c.sendingLabel : c.submitLabel }} <b aria-hidden="true">→</b>
  </button>

  <p class="contact-form-status" role="status" aria-live="polite">
    @switch (state()) {
      @case ('sent') {
        {{ c.successMessage }}
      }
      @case ('error') {
        {{ c.errorMessage }}
      }
      @case ('rate-limited') {
        {{ c.rateLimitMessage }}
      }
      @case ('needs-check') {
        {{ c.spamCheckMessage }}
      }
    }
  </p>
</form>
