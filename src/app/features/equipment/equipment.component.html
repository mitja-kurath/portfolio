@let s = section();
<div appSectionLabel [number]="s.number" [title]="s.title" [elevation]="s.elevation"></div>
<div class="equipment-heading">
  <h2 appDisplayHeading [lines]="s.headingLines" [emphasis]="s.emphasis" [inline]="!!s.emphasisInline"></h2>
  <p>{{ s.intro }}</p>
</div>
<div class="kit-grid">
  @for (group of groups(); track group.id; let i = $index) {
    <article appKitGroup [group]="group" [position]="i + 1"></article>
  }
</div>
